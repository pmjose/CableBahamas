{"name":"SERVICE_ANALYTICS","description":"480 synthetic customer support cases. Case opened date determines volume trends. Resolved cases only for resolution time, SLA and CSAT; open cases have null outcomes. SLA target 24 hours is an illustrative internal target, not law.","module_custom_instructions":{"sql_generation":"All data is synthetic. Reference date 2026-05-31; relative latest month means May 2026 and year-to-date means January through May 2026. Never use CURRENT_DATE for relative periods. No mobile/aliv/RAN/SIM/spectrum data. Do not manufacture values. Do not sum snapshot counts across dates. Use ratio of sums for weighted rates. Currency BSD; percentages expressed in 0-100 units. Return enough detail to name the source and period. Do not join unrelated fact tables."},"tables":[{"name":"support_cases","description":"480 synthetic customer support cases. Case opened date determines volume trends. Resolved cases only for resolution time, SLA and CSAT; open cases have null outcomes. SLA target 24 hours is an illustrative internal target, not law.","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS","table":"SUPPORT_CASES"},"dimensions":[{"name":"case_id","expr":"CASE_ID","data_type":"VARCHAR","description":"case id"},{"name":"customer_id","expr":"CUSTOMER_ID","data_type":"VARCHAR","description":"customer id"},{"name":"island","expr":"ISLAND","data_type":"VARCHAR","description":"island"},{"name":"town","expr":"TOWN","data_type":"VARCHAR","description":"town"},{"name":"service_family","expr":"SERVICE_FAMILY","data_type":"VARCHAR","description":"service family"},{"name":"customer_segment","expr":"CUSTOMER_SEGMENT","data_type":"VARCHAR","description":"customer segment"},{"name":"status","expr":"STATUS","data_type":"VARCHAR","description":"status"},{"name":"category","expr":"CATEGORY","data_type":"VARCHAR","description":"category"},{"name":"priority","expr":"PRIORITY","data_type":"VARCHAR","description":"priority"},{"name":"channel","expr":"CHANNEL"