{"name":"CUSTOMER_ANALYTICS","description":"Current customer snapshot at 2026-05-31: fixed subscriptions, churn risk, CLV, consent and NPS. One primary fixed-service contract per account, not the production population.","module_custom_instructions":{"sql_generation":"All data is synthetic. Reference date 2026-05-31; relative latest month means May 2026 and year-to-date means January through May 2026. Never use CURRENT_DATE for relative periods. No mobile/aliv/RAN/SIM/spectrum data. Do not manufacture values. Do not sum snapshot counts across dates. Use ratio of sums for weighted rates. Currency BSD; percentages expressed in 0-100 units. Return enough detail to name the source and period. Do not join unrelated fact tables."},"tables":[{"name":"customers","description":"Current customer snapshot at 2026-05-31: fixed subscriptions, churn risk, CLV, consent and NPS. One primary fixed-service contract per account, not the production population.","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS","table":"CUSTOMERS"},"dimensions":[{"name":"customer_id","expr":"CUSTOMER_ID","data_type":"VARCHAR","description":"customer id"},{"name":"customer_name","expr":"CUSTOMER_NAME","data_type":"VARCHAR","description":"customer name"},{"name":"product_id","expr":"PRODUCT_ID","data_type":"VARCHAR","description":"product id"},{"name":"product_name","expr":"PRODUCT_NAME","data_type":"VARCHAR","description":"product name"},{"name":"service_family","expr":"SERVICE_FAMILY","data_type":"VARCHAR","description":"service family"},{"name":"customer_segment","expr":"CUSTOMER_SEGMENT","data_type":"VARCHAR","description":"customer segment"},{"name":"island","expr":"ISLAND","data_type":"VARCHAR","description":"island"},{"name":"town","expr":"TOWN","data_type":"VARCHAR","description":"town"},{"name":"churn_risk","expr":"CHURN_RISK","data_type":"VARCHAR","description":"churn risk"},{"name":"tier","expr":"TIER","data_type":"VARCHAR","description":"tier"},{"name":"marketing_consent","expr":"MARKETING_CONSENT","data_type":"BOOLEAN","description":"marketing consent"}],"time_dimensions":[{"name":"join_date","expr":"JOIN_DATE","data_type":"DATE","description":"join date"},{"name":"snapshot_date","expr":"SNAPSHOT_DATE","data_type":"DATE","description":"Fixed synthetic reference date"}],"facts":[{"name":"current_mrr_bsd","expr":"CURRENT_MRR_BSD","data_type":"NUMBER","description":"current mrr bsd"},{"name":"churn_score","expr":"CHURN_SCORE","data_type":"NUMBER","description":"churn score"},{"name":"nps_score","expr":"NPS_SCORE","data_type":"NUMBER","description":"nps score"},{"name":"tenure_months","expr":"TENURE_MONTHS","data_type":"NUMBER","description":"tenure months"},{"name":"expected_24m_clv_bsd","expr":"EXPECTED_24M_CLV_BSD","data_type":"NUMBER","description":"expected 24m clv bsd"}],"metrics":[{"name":"metric_customer_count","expr":"COUNT(DISTINCT CUSTOMER_ID)","description":"customer count"},{"name":"metric_current_mrr_bsd","expr":"SUM(CURRENT_MRR_BSD)","description":"current mrr bsd"},{"name":"metric_average_monthly_revenue_per_account_bsd","expr":"AVG(CURRENT_MRR_BSD)","description":"average monthly revenue per account bsd"},{"name":"metric_average_churn_risk_score","expr":"AVG(CHURN_SCORE)","description":"average churn risk score"},{"name":"metric_expected_24m_clv_bsd","expr":"SUM(EXPECTED_24M_CLV_BSD)","description":"expected 24m clv bsd"},{"name":"metric_nps","expr":"100.0 * (COUNT_IF(NPS_SCORE >= 9) - COUNT_IF(NPS_SCORE <= 6)) / NULLIF(COUNT(NPS_SCORE),0)","description":"nps"},{"name":"metric_high_risk_accounts","expr":"COUNT_IF(CHURN_RISK = 'High')","description":"high risk accounts"}]}],"verified_queries":[{"name":"customer_analytics_example","question":"How many fixed-service customer accounts are in the demo?","sql":"SELECT COUNT(*) AS CUSTOMER_COUNT FROM CABLEBAHAMAS_DEMO.ANALYTICS.CUSTOMERS","use_as_onboarding_question":true}]}