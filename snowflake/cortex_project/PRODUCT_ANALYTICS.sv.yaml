{"name":"PRODUCT_ANALYTICS","description":"Eight fictional fixed-service offers with monthly prices, speed and direct monthly service cost. Product-level direct margin excludes corporate overhead. These are not actual REV tariffs or mobile offers.","module_custom_instructions":{"sql_generation":"All data is synthetic. Reference date 2026-05-31; relative latest month means May 2026 and year-to-date means January through May 2026. Never use CURRENT_DATE for relative periods. No mobile/aliv/RAN/SIM/spectrum data. Do not manufacture values. Do not sum snapshot counts across dates. Use ratio of sums for weighted rates. Currency BSD; percentages expressed in 0-100 units. Return enough detail to name the source and period. Do not join unrelated fact tables."},"tables":[{"name":"products","description":"Eight fictional fixed-service offers with monthly prices, speed and direct monthly service cost. Product-level direct margin excludes corporate overhead. These are not actual REV tariffs or mobile offers.","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS","table":"PRODUCTS"},"dimensions":[{"name":"product_id","expr":"PRODUCT_ID","data_type":"VARCHAR","description":"product id"},{"name":"product_name","expr":"PRODUCT_NAME","data_type":"VARCHAR","description":"product name"},{"name":"service_family","expr":"SERVICE_FAMILY","data_type":"VARCHAR","description":"service family"},{"name":"customer_segment","expr":"CUSTOMER_SEGMENT","data_type":"VARCHAR","description":"customer segment"}],"time_dimensions":[],"facts":[{"name":"monthly_price_bsd","expr":"MONTHLY_PRICE_BSD","data_type":"NUMBER","description":"monthly price bsd"},{"name":"download_mbps","expr":"DOWNLOAD_MBPS","data_type":"NUMBER","description":"download mbps"},{"name":"monthly_cost_bsd","expr":"MONTHLY_COST_BSD","data_type":"NUMBER","description":"monthly cost bsd"}],"metrics":[{"name":"metric_product_count","expr":"COUNT(DISTINCT PRODUCT_ID)","description":"product count"},{"name":"metric_average_price_bsd","expr":"AVG(MONTHLY_PRICE_BSD)","description":"average price bsd"},{"name":"metric_average_direct_margin_bsd","expr":"AVG(MONTHLY_PRICE_BSD-MONTHLY_COST_BSD)","description":"average direct margin bsd"}]}],"verified_queries":[{"name":"product_analytics_example","question":"Which fixed service products have the largest direct monthly margin?","sql":"SELECT PRODUCT_NAME,MONTHLY_PRICE_BSD-MONTHLY_COST_BSD DIRECT_MARGIN_BSD FROM CABLEBAHAMAS_DEMO.ANALYTICS.PRODUCTS ORDER BY DIRECT_MARGIN_BSD DESC","use_as_onboarding_question":true}]}