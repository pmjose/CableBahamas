{"name":"NETWORK_ANALYTICS","description":"Fixed FTTH/HFC network only: 28 synthetic sites across seven Bahamas islands, one row per site-day during May 2026. Filter a single day for homes passed and connected premises. Daily availability is weighted equally because every site-day covers 1440 minutes. No RAN, mobile, 5G or spectrum.","module_custom_instructions":{"sql_generation":"All data is synthetic. Reference date 2026-05-31; relative latest month means May 2026 and year-to-date means January through May 2026. Never use CURRENT_DATE for relative periods. No mobile/aliv/RAN/SIM/spectrum data. Do not manufacture values. Do not sum snapshot counts across dates. Use ratio of sums for weighted rates. Currency BSD; percentages expressed in 0-100 units. Return enough detail to name the source and period. Do not join unrelated fact tables."},"tables":[{"name":"network_daily","description":"Fixed FTTH/HFC network only: 28 synthetic sites across seven Bahamas islands, one row per site-day during May 2026. Filter a single day for homes passed and connected premises. Daily availability is weighted equally because every site-day covers 1440 minutes. No RAN, mobile, 5G or spectrum.","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS","table":"NETWORK_DAILY"},"dimensions":[{"name":"site_id","expr":"SITE_ID","data_type":"VARCHAR","description":"site id"},{"name":"island","expr":"ISLAND","data_type":"VARCHAR","description":"island"},{"name":"access_technology","expr":"ACCESS_TECHNOLOGY","data_type":"VARCHAR","description":"access technology"},{"name":"status","expr":"STATUS","data_type":"VARCHAR","description":"status"}],"time_dimensions":[{"name":"observed_date","expr":"OBSERVED_DATE","data_type":"DATE","description":"observed date"}],"facts":[{"name":"latitude","expr":"LATITUDE","data_type":"NUMBER","description":"latitude"},{"name":"longitude","expr":"LONGITUDE","data_type":"NUMBER","description":"longitude"},{"name":"homes_passed","expr":"HOMES_PASSED","data_type":"NUMBER","description":"homes passed"},{"name":"connected_premises","expr":"CONNECTED_PREMISES","data_type":"NUMBER","description":"connected premises"},{"name":"utilization_pct","expr":"UTILIZATION_PCT","data_type":"NUMBER","description":"utilization pct"},{"name":"availability_pct","expr":"AVAILABILITY_PCT","data_type":"NUMBER","description":"availability pct"},{"name":"outage_minutes","expr":"OUTAGE_MINUTES","data_type":"NUMBER","description":"outage minutes"},{"name":"average_download_mbps","expr":"AVERAGE_DOWNLOAD_MBPS","data_type":"NUMBER","description":"average download mbps"}],"metrics":[{"name":"metric_distinct_sites","expr":"COUNT(DISTINCT SITE_ID)","description":"distinct sites"},{"name":"metric_average_availability_pct","expr":"AVG(AVAILABILITY_PCT)","description":"average availability pct"},{"name":"metric_outage_minutes","expr":"SUM(OUTAGE_MINUTES)","description":"outage minutes"},{"name":"metric_average_utilization_pct","expr":"AVG(UTILIZATION_PCT)","description":"average utilization pct"},{"name":"metric_average_download_mbps","expr":"AVG(AVERAGE_DOWNLOAD_MBPS)","description":"average download mbps"},{"name":"metric_homes_passed","expr":"SUM(HOMES_PASSED)","description":"homes passed"},{"name":"metric_connected_premises","expr":"SUM(CONNECTED_PREMISES)","description":"connected premises"},{"name":"metric_take_rate_pct","expr":"100.0*SUM(CONNECTED_PREMISES)/NULLIF(SUM(HOMES_PASSED),0)","description":"take rate pct"}]}],"verified_queries":[{"name":"network_analytics_example","question":"How many fixed network sites are there by island?","sql":"SELECT ISLAND,COUNT(DISTINCT SITE_ID) SITES FROM CABLEBAHAMAS_DEMO.ANALYTICS.NETWORK_DAILY GROUP BY ISLAND ORDER BY ISLAND","use_as_onboarding_question":true}]}