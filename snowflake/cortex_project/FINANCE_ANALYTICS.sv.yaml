{"name":"FINANCE_ANALYTICS","description":"Monthly product, segment and island financials from June 2025 to May 2026. Revenue is BSD excluding tax. Active accounts are monthly snapshots: filter one month for counts or ARPU. EBITDA equals revenue minus service cost and operating expense. No mobile revenue.","module_custom_instructions":{"sql_generation":"All data is synthetic. Reference date 2026-05-31; relative latest month means May 2026 and year-to-date means January through May 2026. Never use CURRENT_DATE for relative periods. No mobile/aliv/RAN/SIM/spectrum data. Do not manufacture values. Do not sum snapshot counts across dates. Use ratio of sums for weighted rates. Currency BSD; percentages expressed in 0-100 units. Return enough detail to name the source and period. Do not join unrelated fact tables."},"tables":[{"name":"monthly_finance","description":"Monthly product, segment and island financials from June 2025 to May 2026. Revenue is BSD excluding tax. Active accounts are monthly snapshots: filter one month for counts or ARPU. EBITDA equals revenue minus service cost and operating expense. No mobile revenue.","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS","table":"MONTHLY_FINANCE"},"dimensions":[{"name":"product_id","expr":"PRODUCT_ID","data_type":"VARCHAR","description":"product id"},{"name":"product_name","expr":"PRODUCT_NAME","data_type":"VARCHAR","description":"product name"},{"name":"service_family","expr":"SERVICE_FAMILY","data_type":"VARCHAR","description":"service family"},{"name":"customer_segment","expr":"CUSTOMER_SEGMENT","data_type":"VARCHAR","description":"customer segment"},{"name":"island","expr":"ISLAND","data_type":"VARCHAR","description":"island"}],"time_dimensions":[{"name":"month_start","expr":"MONTH_START","data_type":"DATE","description":"month start"}],"facts":[{"name":"active_accounts","expr":"ACTIVE_ACCOUNTS","data_type":"NUMBER","description":"active accounts"},{"name":"revenue_bsd","expr":"REVENUE_BSD","data_type":"NUMBER","description":"revenue bsd"},{"name":"cost_of_service_bsd","expr":"COST_OF_SERVICE_BSD","data_type":"NUMBER","description":"cost of service bsd"},{"name":"operating_expense_bsd","expr":"OPERATING_EXPENSE_BSD","data_type":"NUMBER","description":"operating expense bsd"},{"name":"gross_profit_bsd","expr":"GROSS_PROFIT_BSD","data_type":"NUMBER","description":"gross profit bsd"},{"name":"ebitda_bsd","expr":"EBITDA_BSD","data_type":"NUMBER","description":"ebitda bsd"},{"name":"budget_revenue_bsd","expr":"BUDGET_REVENUE_BSD","data_type":"NUMBER","description":"budget revenue bsd"},{"name":"capex_bsd","expr":"CAPEX_BSD","data_type":"NUMBER","description":"capex bsd"},{"name":"depreciation_bsd","expr":"DEPRECIATION_BSD","data_type":"NUMBER","description":"depreciation bsd"}],"metrics":[{"name":"metric_revenue_bsd","expr":"SUM(REVENUE_BSD)","description":"revenue bsd"},{"name":"metric_cost_of_service_bsd","expr":"SUM(COST_OF_SERVICE_BSD)","description":"cost of service bsd"},{"name":"metric_operating_expense_bsd","expr":"SUM(OPERATING_EXPENSE_BSD)","description":"operating expense bsd"},{"name":"metric_gross_profit_bsd","expr":"SUM(GROSS_PROFIT_BSD)","description":"gross profit bsd"},{"name":"metric_ebitda_bsd","expr":"SUM(EBITDA_BSD)","description":"ebitda bsd"},{"name":"metric_ebitda_margin_pct","expr":"100.0 * SUM(EBITDA_BSD) / NULLIF(SUM(REVENUE_BSD),0)","description":"ebitda margin pct"},{"name":"metric_budget_revenue_bsd","expr":"SUM(BUDGET_REVENUE_BSD)","description":"budget revenue bsd"},{"name":"metric_revenue_variance_bsd","expr":"SUM(REVENUE_BSD)-SUM(BUDGET_REVENUE_BSD)","description":"revenue variance bsd"},{"name":"metric_capex_bsd","expr":"SUM(CAPEX_BSD)","description":"capex bsd"},{"name":"metric_active_accounts","expr":"SUM(ACTIVE_ACCOUNTS)","description":"active accounts"},{"name":"metric_arpu_bsd","expr":"SUM(REVENUE_BSD)/NULLIF(SUM(ACTIVE_ACCOUNTS),0)","description":"arpu bsd"}]}],"verified_queries":[{"name":"finance_analytics_example","question":"What was revenue and EBITDA in May 2026?","sql":"SELECT SUM(REVENUE_BSD) REVENUE_BSD,SUM(EBITDA_BSD) EBITDA_BSD FROM CABLEBAHAMAS_DEMO.ANALYTICS.MONTHLY_FINANCE WHERE MONTH_START='2026-05-01'","use_as_onboarding_question":true}]}