{"name":"BILLING_ANALYTICS","description":"One invoice per active account per month. Billing reconciles to revenue at month grain. Outstanding and days overdue are measured as of May 31 2026, not the current calendar date. Filter outstanding greater than zero for debt analysis.","module_custom_instructions":{"sql_generation":"All data is synthetic. Reference date 2026-05-31; relative latest month means May 2026 and year-to-date means January through May 2026. Never use CURRENT_DATE for relative periods. No mobile/aliv/RAN/SIM/spectrum data. Do not manufacture values. Do not sum snapshot counts across dates. Use ratio of sums for weighted rates. Currency BSD; percentages expressed in 0-100 units. Return enough detail to name the source and period. Do not join unrelated fact tables."},"tables":[{"name":"invoices","description":"One invoice per active account per month. Billing reconciles to revenue at month grain. Outstanding and days overdue are measured as of May 31 2026, not the current calendar date. Filter outstanding greater than zero for debt analysis.","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS","table":"INVOICES"},"dimensions":[{"name":"invoice_id","expr":"INVOICE_ID","data_type":"VARCHAR","description":"invoice id"},{"name":"customer_id","expr":"CUSTOMER_ID","data_type":"VARCHAR","description":"customer id"},{"name":"island","expr":"ISLAND","data_type":"VARCHAR","description":"island"},{"name":"service_family","expr":"SERVICE_FAMILY","data_type":"VARCHAR","description":"service family"},{"name":"customer_segment","expr":"CUSTOMER_SEGMENT","data_type":"VARCHAR","description":"customer segment"},{"name":"status","expr":"STATUS","data_type":"VARCHAR","description":"status"}],"time_dimensions":[{"name":"invoice_date","expr":"INVOICE_DATE","data_type":"DATE","description":"invoice date"},{"name":"due_date","expr":"DUE_DATE","data_type":"DATE","description":"due date"},{"name":"as_of_date","expr":"AS_OF_DATE","data_type":"DATE","description":"Fixed synthetic reference date"}],"facts":[{"name":"amount_bsd","expr":"AMOUNT_BSD","data_type":"NUMBER","description":"amount bsd"},{"name":"paid_bsd","expr":"PAID_BSD","data_type":"NUMBER","description":"paid bsd"},{"name":"outstanding_bsd","expr":"OUTSTANDING_BSD","data_type":"NUMBER","description":"outstanding bsd"},{"name":"days_overdue","expr":"DAYS_OVERDUE","data_type":"NUMBER","description":"days overdue"}],"metrics":[{"name":"metric_invoice_count","expr":"COUNT(DISTINCT INVOICE_ID)","description":"invoice count"},{"name":"metric_billed_bsd","expr":"SUM(AMOUNT_BSD)","description":"billed bsd"},{"name":"metric_collected_bsd","expr":"SUM(PAID_BSD)","description":"collected bsd"},{"name":"metric_outstanding_bsd","expr":"SUM(OUTSTANDING_BSD)","description":"outstanding bsd"},{"name":"metric_collection_rate_pct","expr":"100.0*SUM(PAID_BSD)/NULLIF(SUM(AMOUNT_BSD),0)","description":"collection rate pct"},{"name":"metric_overdue_60_plus_bsd","expr":"SUM(IFF(DAYS_OVERDUE>60,OUTSTANDING_BSD,0))","description":"overdue 60 plus bsd"}]}],"verified_queries":[{"name":"billing_analytics_example","question":"How much outstanding debt is more than 60 days overdue?","sql":"SELECT SUM(OUTSTANDING_BSD) OVERDUE_60_PLUS_BSD FROM CABLEBAHAMAS_DEMO.ANALYTICS.INVOICES WHERE DAYS_OVERDUE>60","use_as_onboarding_question":true}]}