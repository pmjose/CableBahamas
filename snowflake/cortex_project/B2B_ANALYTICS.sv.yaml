{"name":"B2B_ANALYTICS","description":"80 fictional business fixed-connectivity sales opportunities, snapshot May 31 2026. Pipeline means Qualification, Proposal and Negotiation only. Annual contract value is annual BSD, not monthly recurring revenue or recognized revenue. Win rate is won divided by won plus lost.","module_custom_instructions":{"sql_generation":"All data is synthetic. Reference date 2026-05-31; relative latest month means May 2026 and year-to-date means January through May 2026. Never use CURRENT_DATE for relative periods. No mobile/aliv/RAN/SIM/spectrum data. Do not manufacture values. Do not sum snapshot counts across dates. Use ratio of sums for weighted rates. Currency BSD; percentages expressed in 0-100 units. Return enough detail to name the source and period. Do not join unrelated fact tables."},"tables":[{"name":"b2b_pipeline","description":"80 fictional business fixed-connectivity sales opportunities, snapshot May 31 2026. Pipeline means Qualification, Proposal and Negotiation only. Annual contract value is annual BSD, not monthly recurring revenue or recognized revenue. Win rate is won divided by won plus lost.","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS","table":"B2B_PIPELINE"},"dimensions":[{"name":"opportunity_id","expr":"OPPORTUNITY_ID","data_type":"VARCHAR","description":"opportunity id"},{"name":"account_name","expr":"ACCOUNT_NAME","data_type":"VARCHAR","description":"account name"},{"name":"industry","expr":"INDUSTRY","data_type":"VARCHAR","description":"industry"},{"name":"island","expr":"ISLAND","data_type":"VARCHAR","description":"island"},{"name":"product_name","expr":"PRODUCT_NAME","data_type":"VARCHAR","description":"product name"},{"name":"stage","expr":"STAGE","data_type":"VARCHAR","description":"stage"},{"name":"owner_name","expr":"OWNER_NAME","data_type":"VARCHAR","description":"owner name"}],"time_dimensions":[{"name":"created_date","expr":"CREATED_DATE","data_type":"DATE","description":"created date"},{"name":"close_date","expr":"CLOSE_DATE","data_type":"DATE","description":"close date"},{"name":"snapshot_date","expr":"SNAPSHOT_DATE","data_type":"DATE","description":"Fixed synthetic reference date"}],"facts":[{"name":"win_probability","expr":"WIN_PROBABILITY","data_type":"NUMBER","description":"win probability"},{"name":"annual_contract_value_bsd","expr":"ANNUAL_CONTRACT_VALUE_BSD","data_type":"NUMBER","description":"annual contract value bsd"}],"metrics":[{"name":"metric_opportunity_count","expr":"COUNT(DISTINCT OPPORTUNITY_ID)","description":"opportunity count"},{"name":"metric_open_pipeline_acv_bsd","expr":"SUM(IFF(STAGE IN ('Qualification','Proposal','Negotiation'),ANNUAL_CONTRACT_VALUE_BSD,0))","description":"open pipeline acv bsd"},{"name":"metric_weighted_pipeline_acv_bsd","expr":"SUM(IFF(STAGE IN ('Qualification','Proposal','Negotiation'),ANNUAL_CONTRACT_VALUE_BSD*WIN_PROBABILITY,0))","description":"weighted pipeline acv bsd"},{"name":"metric_won_acv_bsd","expr":"SUM(IFF(STAGE='Closed Won',ANNUAL_CONTRACT_VALUE_BSD,0))","description":"won acv bsd"},{"name":"metric_win_rate_pct","expr":"100.0*COUNT_IF(STAGE='Closed Won')/NULLIF(COUNT_IF(STAGE IN ('Closed Won','Closed Lost')),0)","description":"win rate pct"}]}],"verified_queries":[{"name":"b2b_analytics_example","question":"What is the open and probability-weighted business pipeline?","sql":"SELECT SUM(ANNUAL_CONTRACT_VALUE_BSD) OPEN_PIPELINE_ACV_BSD,SUM(ANNUAL_CONTRACT_VALUE_BSD*WIN_PROBABILITY) WEIGHTED_PIPELINE_ACV_BSD FROM CABLEBAHAMAS_DEMO.ANALYTICS.B2B_PIPELINE WHERE STAGE IN ('Qualification','Proposal','Negotiation')","use_as_onboarding_question":true}]}