{"name":"MOBILE_ANALYTICS","description":"aliv mobile lines at 2026-10-31: one row per line (180,500) with island, plan, plan type (Prepaid, Postpaid, Business, IoT), monthly ARPU, data usage and churn risk. CUSTOMER_ID is set when the line belongs to a convergent REV household.","module_custom_instructions":{"sql_generation":"All data is synthetic demo data for Cable Bahamas (REV fixed and aliv mobile), generated from the web demo baseline. Reference date 2026-10-31: \"latest\", \"current\", \"this month\" or \"today\" mean October 2026; \"this quarter\" means August–October 2026 unless the user names a calendar quarter; \"year to date\" means January–October 2026. Never use CURRENT_DATE. Currency is BSD (pegged 1:1 to USD). Percentages are 0-100. Use ratio of sums for weighted rates. Do not sum snapshot counts across dates. Do not join unrelated fact tables. Islands: New Providence (Nassau), Grand Bahama (Freeport), Abaco, Eleuthera, Exuma, Andros, Other Family Islands (Bimini and others)."},"tables":[{"name":"MOBILE_SUBSCRIPTIONS","description":"One row per active aliv mobile line, snapshot 2026-10-31.","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS_V2","table":"MOBILE_SUBSCRIPTIONS"},"dimensions":[{"name":"line_id","expr":"LINE_ID","data_type":"VARCHAR","description":"line id"},{"name":"customer_id","expr":"CUSTOMER_ID","data_type":"VARCHAR","description":"customer id"},{"name":"island","expr":"ISLAND","data_type":"VARCHAR","description":"island"},{"name":"plan_name","expr":"PLAN_NAME","data_type":"VARCHAR","description":"plan name"},{"name":"plan_type","expr":"PLAN_TYPE","data_type":"VARCHAR","description":"plan type"},{"name":"churn_risk","expr":"CHURN_RISK","data_type":"VARCHAR","description":"churn risk"}],"time_dimensions":[{"name":"activation_date","expr":"ACTIVATION_DATE","data_type":"DATE","description":"activation date"},{"name":"snapshot_date","expr":"SNAPSHOT_DATE","data_type":"DATE","description":"snapshot date"}],"facts":[{"name":"monthly_arpu_bsd","expr":"MONTHLY_ARPU_BSD","data_type":"NUMBER","description":"monthly arpu bsd"},{"name":"data_gb_month","expr":"DATA_GB_MONTH","data_type":"NUMBER","description":"data gb month"}],"metrics":[{"name":"mobile_lines","expr":"COUNT(DISTINCT LINE_ID)","description":"mobile lines"},{"name":"mobile_revenue_bsd","expr":"SUM(MONTHLY_ARPU_BSD)","description":"mobile revenue bsd"},{"name":"mobile_arpu_bsd","expr":"AVG(MONTHLY_ARPU_BSD)","description":"mobile arpu bsd"},{"name":"convergent_lines","expr":"COUNT_IF(CUSTOMER_ID IS NOT NULL)","description":"convergent lines"},{"name":"high_risk_lines","expr":"COUNT_IF(CHURN_RISK = 'High')","description":"high risk lines"}]}],"verified_queries":[{"name":"mobile_analytics_1","question":"How many mobile subscribers do we have by plan type?","sql":"SELECT PLAN_TYPE, COUNT(*) AS LINES, AVG(MONTHLY_ARPU_BSD) AS ARPU_BSD FROM CABLEBAHAMAS_DEMO.ANALYTICS_V2.MOBILE_SUBSCRIPTIONS GROUP BY PLAN_TYPE ORDER BY LINES DESC","use_as_onboarding_question":true}]}