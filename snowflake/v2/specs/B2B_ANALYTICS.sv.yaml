{"name":"B2B_ANALYTICS","description":"Business and wholesale: B2B_ACCOUNTS (26 named accounts with segment, island, MRR, ARR, contract end, status, health) and B2B_PIPELINE (open pipeline BSD 4.2M across Qualification, Proposal, Negotiation, plus recent won/lost). ACV is annual BSD, not recognised revenue.","module_custom_instructions":{"sql_generation":"All data is synthetic demo data for Cable Bahamas (REV fixed and aliv mobile), generated from the web demo baseline. Reference date 2026-10-31: \"latest\", \"current\", \"this month\" or \"today\" mean October 2026; \"this quarter\" means August–October 2026 unless the user names a calendar quarter; \"year to date\" means January–October 2026. Never use CURRENT_DATE. Currency is BSD (pegged 1:1 to USD). Percentages are 0-100. Use ratio of sums for weighted rates. Do not sum snapshot counts across dates. Do not join unrelated fact tables. Islands: New Providence (Nassau), Grand Bahama (Freeport), Abaco, Eleuthera, Exuma, Andros, Other Family Islands (Bimini and others)."},"tables":[{"name":"B2B_ACCOUNTS","description":"One row per named business or wholesale account.","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS_V2","table":"B2B_ACCOUNTS"},"dimensions":[{"name":"account_id","expr":"ACCOUNT_ID","data_type":"VARCHAR","description":"account id"},{"name":"account_name","expr":"ACCOUNT_NAME","data_type":"VARCHAR","description":"account name"},{"name":"segment","expr":"SEGMENT","data_type":"VARCHAR","description":"segment"},{"name":"vertical","expr":"VERTICAL","data_type":"VARCHAR","description":"vertical"},{"name":"island","expr":"ISLAND","data_type":"VARCHAR","description":"island"},{"name":"status","expr":"STATUS","data_type":"VARCHAR","description":"status"},{"name":"account_owner","expr":"ACCOUNT_OWNER","data_type":"VARCHAR","description":"account owner"}],"time_dimensions":[{"name":"contract_end","expr":"CONTRACT_END","data_type":"DATE","description":"contract end"}],"facts":[{"name":"mrr_bsd","expr":"MRR_BSD","data_type":"NUMBER","description":"mrr bsd"},{"name":"arr_bsd","expr":"ARR_BSD","data_type":"NUMBER","description":"arr bsd"},{"name":"sites","expr":"SITES","data_type":"NUMBER","description":"sites"},{"name":"circuits","expr":"CIRCUITS","data_type":"NUMBER","description":"circuits"},{"name":"health_score","expr":"HEALTH_SCORE","data_type":"NUMBER","description":"health score"},{"name":"nps","expr":"NPS","data_type":"NUMBER","description":"nps"}],"metrics":[{"name":"accounts","expr":"COUNT(DISTINCT ACCOUNT_ID)","description":"accounts"},{"name":"total_arr_bsd","expr":"SUM(ARR_BSD)","description":"arr bsd"},{"name":"accounts_at_risk","expr":"COUNT_IF(STATUS IN ('At Risk', 'Watch'))","description":"accounts at risk"}]},{"name":"B2B_PIPELINE","description":"One row per sales opportunity.","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS_V2","table":"B2B_PIPELINE"},"dimensions":[{"name":"opportunity_id","expr":"OPPORTUNITY_ID","data_type":"VARCHAR","description":"opportunity id"},{"name":"account_name","expr":"ACCOUNT_NAME","data_type":"VARCHAR","description":"account name"},{"name":"island","expr":"ISLAND","data_type":"VARCHAR","description":"island"},{"name":"product","expr":"PRODUCT","data_type":"VARCHAR","description":"product"},{"name":"stage","expr":"STAGE","data_type":"VARCHAR","description":"stage"},{"name":"owner_name","expr":"OWNER_NAME","data_type":"VARCHAR","description":"owner name"}],"time_dimensions":[{"name":"expected_close","expr":"EXPECTED_CLOSE","data_type":"DATE","description":"expected close"}],"facts":[{"name":"win_probability","expr":"WIN_PROBABILITY","data_type":"NUMBER","description":"win probability"},{"name":"annual_contract_value_bsd","expr":"ANNUAL_CONTRACT_VALUE_BSD","data_type":"NUMBER","description":"annual contract value bsd"}],"metrics":[{"name":"open_pipeline_bsd","expr":"SUM(IFF(STAGE IN ('Qualification', 'Proposal', 'Negotiation'), ANNUAL_CONTRACT_VALUE_BSD, 0))","description":"open pipeline bsd"},{"name":"weighted_pipeline_bsd","expr":"SUM(IFF(STAGE IN ('Qualification', 'Proposal', 'Negotiation'), ANNUAL_CONTRACT_VALUE_BSD * WIN_PROBABILITY, 0))","description":"weighted pipeline bsd"},{"name":"win_rate_pct","expr":"100.0 * COUNT_IF(STAGE = 'Closed Won') / NULLIF(COUNT_IF(STAGE IN ('Closed Won', 'Closed Lost')), 0)","description":"win rate pct"}]}],"verified_queries":[{"name":"b2b_analytics_1","question":"What is the open B2B pipeline by stage?","sql":"SELECT STAGE, COUNT(*) AS OPPORTUNITIES, SUM(ANNUAL_CONTRACT_VALUE_BSD) AS ACV_BSD FROM CABLEBAHAMAS_DEMO.ANALYTICS_V2.B2B_PIPELINE WHERE STAGE IN ('Qualification','Proposal','Negotiation') GROUP BY STAGE","use_as_onboarding_question":true},{"name":"b2b_analytics_2","question":"Which business accounts are at risk?","sql":"SELECT ACCOUNT_NAME, SEGMENT, ISLAND, ARR_BSD, STATUS, CONTRACT_END FROM CABLEBAHAMAS_DEMO.ANALYTICS_V2.B2B_ACCOUNTS WHERE STATUS IN ('At Risk','Watch','Renewal') ORDER BY ARR_BSD DESC","use_as_onboarding_question":false}]}