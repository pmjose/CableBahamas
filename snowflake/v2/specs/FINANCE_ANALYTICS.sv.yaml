{"name":"FINANCE_ANALYTICS","description":"Monthly group P&L by service line and island, Nov 2025–Oct 2026: revenue, budget (plan), cost of service, operating expense, EBITDA and capex in BSD. Service lines: Fixed (FTTH), Fixed (HFC), Mobile (Consumer), Mobile (B2B), Business fixed, Wholesale.","module_custom_instructions":{"sql_generation":"All data is synthetic demo data for Cable Bahamas (REV fixed and aliv mobile), generated from the web demo baseline. Reference date 2026-10-31: \"latest\", \"current\", \"this month\" or \"today\" mean October 2026; \"this quarter\" means August–October 2026 unless the user names a calendar quarter; \"year to date\" means January–October 2026. Never use CURRENT_DATE. Currency is BSD (pegged 1:1 to USD). Percentages are 0-100. Use ratio of sums for weighted rates. Do not sum snapshot counts across dates. Do not join unrelated fact tables. Islands: New Providence (Nassau), Grand Bahama (Freeport), Abaco, Eleuthera, Exuma, Andros, Other Family Islands (Bimini and others)."},"tables":[{"name":"MONTHLY_FINANCE","description":"One row per month × service line × island. Sum rows for totals.","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS_V2","table":"MONTHLY_FINANCE"},"dimensions":[{"name":"service_line","expr":"SERVICE_LINE","data_type":"VARCHAR","description":"service line"},{"name":"island","expr":"ISLAND","data_type":"VARCHAR","description":"island"}],"time_dimensions":[{"name":"month_start","expr":"MONTH_START","data_type":"DATE","description":"month start"}],"facts":[{"name":"revenue_bsd","expr":"REVENUE_BSD","data_type":"NUMBER","description":"revenue bsd"},{"name":"budget_revenue_bsd","expr":"BUDGET_REVENUE_BSD","data_type":"NUMBER","description":"budget revenue bsd"},{"name":"cost_of_service_bsd","expr":"COST_OF_SERVICE_BSD","data_type":"NUMBER","description":"cost of service bsd"},{"name":"operating_expense_bsd","expr":"OPERATING_EXPENSE_BSD","data_type":"NUMBER","description":"operating expense bsd"},{"name":"ebitda_bsd","expr":"EBITDA_BSD","data_type":"NUMBER","description":"ebitda bsd"},{"name":"capex_bsd","expr":"CAPEX_BSD","data_type":"NUMBER","description":"capex bsd"}],"metrics":[{"name":"total_revenue_bsd","expr":"SUM(REVENUE_BSD)","description":"revenue bsd"},{"name":"total_budget_revenue_bsd","expr":"SUM(BUDGET_REVENUE_BSD)","description":"budget revenue bsd"},{"name":"revenue_vs_plan_bsd","expr":"SUM(REVENUE_BSD) - SUM(BUDGET_REVENUE_BSD)","description":"revenue vs plan bsd"},{"name":"total_ebitda_bsd","expr":"SUM(EBITDA_BSD)","description":"ebitda bsd"},{"name":"ebitda_margin_pct","expr":"100.0 * SUM(EBITDA_BSD) / NULLIF(SUM(REVENUE_BSD), 0)","description":"ebitda margin pct"},{"name":"total_capex_bsd","expr":"SUM(CAPEX_BSD)","description":"capex bsd"},{"name":"total_cost_of_service_bsd","expr":"SUM(COST_OF_SERVICE_BSD)","description":"cost of service bsd"},{"name":"total_operating_expense_bsd","expr":"SUM(OPERATING_EXPENSE_BSD)","description":"operating expense bsd"}]}],"verified_queries":[{"name":"finance_analytics_1","question":"What was revenue and EBITDA in October 2026?","sql":"SELECT SUM(REVENUE_BSD) AS REVENUE_BSD, SUM(EBITDA_BSD) AS EBITDA_BSD, 100*SUM(EBITDA_BSD)/SUM(REVENUE_BSD) AS EBITDA_MARGIN_PCT FROM CABLEBAHAMAS_DEMO.ANALYTICS_V2.MONTHLY_FINANCE WHERE MONTH_START='2026-10-01'","use_as_onboarding_question":true},{"name":"finance_analytics_2","question":"Show monthly revenue vs plan","sql":"SELECT MONTH_START, SUM(REVENUE_BSD) AS REVENUE_BSD, SUM(BUDGET_REVENUE_BSD) AS PLAN_BSD FROM CABLEBAHAMAS_DEMO.ANALYTICS_V2.MONTHLY_FINANCE GROUP BY MONTH_START ORDER BY MONTH_START","use_as_onboarding_question":false},{"name":"finance_analytics_3","question":"Revenue by service line this month","sql":"SELECT SERVICE_LINE, SUM(REVENUE_BSD) AS REVENUE_BSD FROM CABLEBAHAMAS_DEMO.ANALYTICS_V2.MONTHLY_FINANCE WHERE MONTH_START='2026-10-01' GROUP BY SERVICE_LINE ORDER BY REVENUE_BSD DESC","use_as_onboarding_question":false}]}