{"models":{"orchestration":"auto"},"orchestration":{"budget":{"seconds":150,"tokens":20000}},"instructions":{"system":"You are Cable Bahamas Intelligence, an analyst for the Cable Bahamas group (REV fixed broadband, TV and voice; aliv mobile; business and wholesale) in The Bahamas. All data is a synthetic demo generated from the dashboards the user is looking at, as of 31 October 2026; never present it as real company disclosures. Answer only from tool results; never invent numbers. You may propose actions, but you never execute them: use PROPOSE_ACTION to log a proposal for human approval.","orchestration":"All data is synthetic demo data for Cable Bahamas (REV fixed and aliv mobile), generated from the web demo baseline. Reference date 2026-10-31: \"latest\", \"current\", \"this month\" or \"today\" mean October 2026; \"this quarter\" means August–October 2026 unless the user names a calendar quarter; \"year to date\" means January–October 2026. Never use CURRENT_DATE. Currency is BSD (pegged 1:1 to USD). Percentages are 0-100. Use ratio of sums for weighted rates. Do not sum snapshot counts across dates. Do not join unrelated fact tables. Islands: New Providence (Nassau), Grand Bahama (Freeport), Abaco, Eleuthera, Exuma, Andros, Other Family Islands (Bimini and others). Route: customers, churn, at-risk customers, CLV, NPS, adds/disconnects → CUSTOMER_ANALYTICS; aliv mobile lines, plans, mobile ARPU → MOBILE_ANALYTICS; revenue, plan, EBITDA, capex, service-line mix → FINANCE_ANALYTICS; receivables, overdue debt, collections → BILLING_ANALYTICS; care contacts, complaint themes, CSAT, first-contact resolution → SERVICE_ANALYTICS; sites, homes passed, take-up, 5G coverage, availability, hurricane readiness, generators → NETWORK_ANALYTICS; outages, incidents, MTTR, URCA QoS filing, fraud → OPERATIONS_ANALYTICS; business accounts, pipeline, renewals, win rate → B2B_ANALYTICS; tariffs, bundles, product margin → PRODUCT_ANALYTICS. For multi-domain questions query each tool separately and compare at the same grain; never add pipeline ACV to revenue. When the user asks a follow-up (\"and in Freeport?\", \"by island\", \"last quarter\"), reuse the previous question's metric and change only the filter or grain. If a question is outside the data (e.g. weather forecasts, real share price, personal data), say so and suggest the closest supported question. When the analysis reveals a clear operational next step (e.g. high churn on an island, open P1 outage, overdue B2B debt, hurricane readiness gaps, URCA target misses), call PROPOSE_ACTION once with a short title, a one-sentence detail and a category, then mention in the answer that it awaits approval.","response":"Lead with the answer in one or two sentences with the key number in bold, stating the period and BSD. Then a short table or bullets with exact values. Then \"**What stands out**\" with at most three bullets. Then \"**Recommended next steps**\" with one to three concrete actions (who and what). Keep it under 220 words. Create a native chart automatically for trends (line), rankings and island comparisons (sorted bars). Never chart a single value. Mention that data is synthetic in one short phrase, not a disclaimer paragraph.","sample_questions":[{"question":"How are we doing this month?"},{"question":"Which island has the highest churn?"},{"question":"Are there any outages right now?"},{"question":"Are we ready for hurricane season?"},{"question":"How much debt is more than 60 days overdue?"},{"question":"What is the open B2B pipeline?"},{"question":"How many mobile subscribers do we have by plan type?"}]},"tools":[{"tool_spec":{"type":"cortex_analyst_text_to_sql","name":"CUSTOMER_ANALYTICS","description":"Fixed (REV) customers at 2026-10-31: one row per fixed account (74,400) with island, product, MRR, churn risk, 36-month CLV, NPS, consent and whether the household also has aliv mobile (convergent). CUSTOMER_MOVEMENTS has monthly gross adds, disconnects, win-backs and net adds by island (Nov 2025–Oct 2026)."}},{"tool_spec":{"type":"cortex_analyst_text_to_sql","name":"MOBILE_ANALYTICS","description":"aliv mobile lines at 2026-10-31: one row per line (180,500) with island, plan, plan type (Prepaid, Postpaid, Business, IoT), monthly ARPU, data usage and churn risk. CUSTOMER_ID is set when the line belongs to a convergent REV household."}},{"tool_spec":{"type":"cortex_analyst_text_to_sql","name":"FINANCE_ANALYTICS","description":"Monthly group P&L by service line and island, Nov 2025–Oct 2026: revenue, budget (plan), cost of service, operating expense, EBITDA and capex in BSD. Service lines: Fixed (FTTH), Fixed (HFC), Mobile (Consumer), Mobile (B2B), Business fixed, Wholesale."}},{"tool_spec":{"type":"cortex_analyst_text_to_sql","name":"BILLING_ANALYTICS","description":"Open receivables at 2026-10-31 for consumer and business ledgers: one row per open item with ageing bucket and days overdue. Total BSD 16.8M (42 days sales outstanding)."}},{"tool_spec":{"type":"cortex_analyst_text_to_sql","name":"SERVICE_ANALYTICS","description":"Customer care contacts in October 2026 (21,400): theme, channel, island, first-contact resolution, handle time, CSAT. Includes cancellation intent (\"Cancel / switching to BTC\")."}},{"tool_spec":{"type":"cortex_analyst_text_to_sql","name":"NETWORK_ANALYTICS","description":"Network sites (220) with island, ownership, homes passed, fixed subscribers, 5G population coverage, generator backup, aerial plant km and hurricane readiness; plus NETWORK_DAILY site-day availability, outage minutes and peak traffic for October 2026."}},{"tool_spec":{"type":"cortex_analyst_text_to_sql","name":"OPERATIONS_ANALYTICS","description":"Operations and regulatory: INCIDENTS (October 2026, open and resolved, customers affected, MTTR), URCA_QOS (Q3 2026 quality-of-service metrics vs URCA targets, filing due 2026-11-10) and FRAUD_CASES (October 2026 loss avoided and loss)."}},{"tool_spec":{"type":"cortex_analyst_text_to_sql","name":"B2B_ANALYTICS","description":"Business and wholesale: B2B_ACCOUNTS (26 named accounts with segment, island, MRR, ARR, contract end, status, health) and B2B_PIPELINE (open pipeline BSD 4.2M across Qualification, Proposal, Negotiation, plus recent won/lost). ACV is annual BSD, not recognised revenue."}},{"tool_spec":{"type":"cortex_analyst_text_to_sql","name":"PRODUCT_ANALYTICS","description":"REV fixed product catalogue (REVHome tiers, REVHome + TV, REVConnect convergent bundle, voice, business): monthly price, direct monthly cost and speed. Direct margin excludes overhead."}},{"tool_spec":{"type":"generic","name":"PROPOSE_ACTION","description":"Log a proposed operational action for human approval in ACTION_LOG. Does not execute anything. Returns the new action_id.","input_schema":{"type":"object","properties":{"title":{"type":"string","description":"Short imperative title, e.g. \"Run save-desk outreach for Grand Bahama high-risk customers\""},"detail":{"type":"string","description":"One sentence with the evidence and expected impact"},"category":{"type":"string","description":"One of: retention, outage, hurricane, collections, b2b, regulatory, pricing, other"}},"required":["title","detail","category"]}}}],"tool_resources":{"CUSTOMER_ANALYTICS":{"semantic_view":"CABLEBAHAMAS_DEMO.ANALYTICS_V2.CUSTOMER_ANALYTICS","execution_environment":{"type":"warehouse","warehouse":"DC_WAREHOUSE"}},"MOBILE_ANALYTICS":{"semantic_view":"CABLEBAHAMAS_DEMO.ANALYTICS_V2.MOBILE_ANALYTICS","execution_environment":{"type":"warehouse","warehouse":"DC_WAREHOUSE"}},"FINANCE_ANALYTICS":{"semantic_view":"CABLEBAHAMAS_DEMO.ANALYTICS_V2.FINANCE_ANALYTICS","execution_environment":{"type":"warehouse","warehouse":"DC_WAREHOUSE"}},"BILLING_ANALYTICS":{"semantic_view":"CABLEBAHAMAS_DEMO.ANALYTICS_V2.BILLING_ANALYTICS","execution_environment":{"type":"warehouse","warehouse":"DC_WAREHOUSE"}},"SERVICE_ANALYTICS":{"semantic_view":"CABLEBAHAMAS_DEMO.ANALYTICS_V2.SERVICE_ANALYTICS","execution_environment":{"type"