{"name":"NETWORK_ANALYTICS","description":"Network sites (220) with island, ownership, homes passed, fixed subscribers, 5G population coverage, generator backup, aerial plant km and hurricane readiness; plus NETWORK_DAILY site-day availability, outage minutes and peak traffic for October 2026.","module_custom_instructions":{"sql_generation":"All data is synthetic demo data for Cable Bahamas (REV fixed and aliv mobile), generated from the web demo baseline. Reference date 2026-10-31: \"latest\", \"current\", \"this month\" or \"today\" mean October 2026; \"this quarter\" means August–October 2026 unless the user names a calendar quarter; \"year to date\" means January–October 2026. Never use CURRENT_DATE. Currency is BSD (pegged 1:1 to USD). Percentages are 0-100. Use ratio of sums for weighted rates. Do not sum snapshot counts across dates. Do not join unrelated fact tables. Islands: New Providence (Nassau), Grand Bahama (Freeport), Abaco, Eleuthera, Exuma, Andros, Other Family Islands (Bimini and others)."},"tables":[{"name":"NETWORK_SITES","description":"One row per active site (220).","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS_V2","table":"NETWORK_SITES"},"primary_key":{"columns":["SITE_ID"]},"dimensions":[{"name":"site_id","expr":"SITE_ID","data_type":"VARCHAR","description":"site id"},{"name":"island","expr":"ISLAND","data_type":"VARCHAR","description":"island"},{"name":"town","expr":"TOWN","data_type":"VARCHAR","description":"town"},{"name":"site_type","expr":"SITE_TYPE","data_type":"VARCHAR","description":"site type"},{"name":"ownership","expr":"OWNERSHIP","data_type":"VARCHAR","description":"ownership"},{"name":"has_generator","expr":"HAS_GENERATOR","data_type":"BOOLEAN","description":"has generator"},{"name":"hurricane_readiness","expr":"HURRICANE_READINESS","data_type":"VARCHAR","description":"hurricane readiness"},{"name":"status","expr":"STATUS","data_type":"VARCHAR","description":"status"}],"time_dimensions":[],"facts":[{"name":"latitude","expr":"LATITUDE","data_type":"NUMBER","description":"latitude"},{"name":"longitude","expr":"LONGITUDE","data_type":"NUMBER","description":"longitude"},{"name":"aerial_plant_km","expr":"AERIAL_PLANT_KM","data_type":"NUMBER","description":"aerial plant km"},{"name":"homes_passed","expr":"HOMES_PASSED","data_type":"NUMBER","description":"homes passed"},{"name":"fixed_subscribers","expr":"FIXED_SUBSCRIBERS","data_type":"NUMBER","description":"fixed subscribers"},{"name":"pop_coverage_5g_pct","expr":"POP_COVERAGE_5G_PCT","data_type":"NUMBER","description":"pop coverage 5g pct"}],"metrics":[{"name":"sites","expr":"COUNT(DISTINCT SITE_ID)","description":"sites"},{"name":"total_homes_passed","expr":"SUM(HOMES_PASSED)","description":"homes passed"},{"name":"total_fixed_subscribers","expr":"SUM(FIXED_SUBSCRIBERS)","description":"fixed subscribers"},{"name":"take_up_pct","expr":"100.0 * SUM(FIXED_SUBSCRIBERS) / NULLIF(SUM(HOMES_PASSED), 0)","description":"take up pct"},{"name":"sites_with_generator","expr":"COUNT_IF(HAS_GENERATOR)","description":"sites with generator"},{"name":"total_aerial_plant_km","expr":"SUM(AERIAL_PLANT_KM)","description":"aerial plant km"}]},{"name":"NETWORK_DAILY","description":"One row per site per day in October 2026.","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS_V2","table":"NETWORK_DAILY"},"dimensions":[{"name":"site_id","expr":"SITE_ID","data_type":"VARCHAR","description":"site id"},{"name":"island","expr":"ISLAND","data_type":"VARCHAR","description":"island"}],"time_dimensions":[{"name":"observed_date","expr":"OBSERVED_DATE","data_type":"DATE","description":"observed date"}],"facts":[{"name":"availability_pct","expr":"AVAILABILITY_PCT","data_type":"NUMBER","description":"availability pct"},{"name":"outage_minutes","expr":"OUTAGE_MINUTES","data_type":"NUMBER","description":"outage minutes"},{"name":"peak_traffic_gbps","expr":"PEAK_TRAFFIC_GBPS","data_type":"NUMBER","description":"peak traffic gbps"},{"name":"utilisation_pct","expr":"UTILISATION_PCT","data_type":"NUMBER","description":"utilisation pct"},{"name":"avg_download_mbps","expr":"AVG_DOWNLOAD_MBPS","data_type":"NUMBER","description":"avg download mbps"}],"metrics":[{"name":"total_availability_pct","expr":"100.0 * (1 - SUM(OUTAGE_MINUTES) / NULLIF(COUNT(*) * 1440, 0))","description":"availability pct"},{"name":"total_outage_minutes","expr":"SUM(OUTAGE_MINUTES)","description":"outage minutes"}]}],"relationships":[{"name":"daily_to_site","left_table":"NETWORK_DAILY","right_table":"NETWORK_SITES","relationship_columns":[{"left_column":"SITE_ID","right_column":"SITE_ID"}]}],"verified_queries":[{"name":"network_analytics_1","question":"How many sites and homes passed do we have by island?","sql":"SELECT ISLAND, COUNT(*) AS SITES, SUM(HOMES_PASSED) AS HOMES_PASSED, AVG(POP_COVERAGE_5G_PCT) AS COV_5G_PCT FROM CABLEBAHAMAS_DEMO.ANALYTICS_V2.NETWORK_SITES GROUP BY ISLAND ORDER BY SITES DESC","use_as_onboarding_question":true},{"name":"network_analytics_2","question":"Are we ready for hurricane season?","sql":"SELECT ISLAND, COUNT(*) AS SITES, COUNT_IF(HAS_GENERATOR) AS WITH_GENERATOR, SUM(AERIAL_PLANT_KM) AS AERIAL_KM, MAX(HURRICANE_READINESS) AS READINESS FROM CABLEBAHAMAS_DEMO.ANALYTICS_V2.NETWORK_SITES GROUP BY ISLAND ORDER BY AERIAL_KM DESC","use_as_onboarding_question":false}]}