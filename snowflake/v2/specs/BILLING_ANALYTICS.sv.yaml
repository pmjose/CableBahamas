{"name":"BILLING_ANALYTICS","description":"Open receivables at 2026-10-31 for consumer and business ledgers: one row per open item with ageing bucket and days overdue. Total BSD 16.8M (42 days sales outstanding).","module_custom_instructions":{"sql_generation":"All data is synthetic demo data for Cable Bahamas (REV fixed and aliv mobile), generated from the web demo baseline. Reference date 2026-10-31: \"latest\", \"current\", \"this month\" or \"today\" mean October 2026; \"this quarter\" means August–October 2026 unless the user names a calendar quarter; \"year to date\" means January–October 2026. Never use CURRENT_DATE. Currency is BSD (pegged 1:1 to USD). Percentages are 0-100. Use ratio of sums for weighted rates. Do not sum snapshot counts across dates. Do not join unrelated fact tables. Islands: New Providence (Nassau), Grand Bahama (Freeport), Abaco, Eleuthera, Exuma, Andros, Other Family Islands (Bimini and others)."},"tables":[{"name":"RECEIVABLES","description":"One row per open receivable item at 2026-10-31.","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS_V2","table":"RECEIVABLES"},"dimensions":[{"name":"invoice_id","expr":"INVOICE_ID","data_type":"VARCHAR","description":"invoice id"},{"name":"customer_id","expr":"CUSTOMER_ID","data_type":"VARCHAR","description":"customer id"},{"name":"account_name","expr":"ACCOUNT_NAME","data_type":"VARCHAR","description":"account name"},{"name":"ledger","expr":"LEDGER","data_type":"VARCHAR","description":"ledger"},{"name":"island","expr":"ISLAND","data_type":"VARCHAR","description":"island"},{"name":"ageing_bucket","expr":"AGEING_BUCKET","data_type":"VARCHAR","description":"ageing bucket"}],"time_dimensions":[{"name":"as_of_date","expr":"AS_OF_DATE","data_type":"DATE","description":"as of date"}],"facts":[{"name":"days_overdue","expr":"DAYS_OVERDUE","data_type":"NUMBER","description":"days overdue"},{"name":"outstanding_bsd","expr":"OUTSTANDING_BSD","data_type":"NUMBER","description":"outstanding bsd"}],"metrics":[{"name":"total_outstanding_bsd","expr":"SUM(OUTSTANDING_BSD)","description":"outstanding bsd"},{"name":"overdue_60_plus_bsd","expr":"SUM(IFF(DAYS_OVERDUE > 60, OUTSTANDING_BSD, 0))","description":"overdue 60 plus bsd"},{"name":"open_items","expr":"COUNT(DISTINCT INVOICE_ID)","description":"open items"}]}],"verified_queries":[{"name":"billing_analytics_1","question":"How much debt is more than 60 days overdue?","sql":"SELECT LEDGER, SUM(OUTSTANDING_BSD) AS OVERDUE_60_PLUS_BSD FROM CABLEBAHAMAS_DEMO.ANALYTICS_V2.RECEIVABLES WHERE DAYS_OVERDUE > 60 GROUP BY LEDGER","use_as_onboarding_question":true},{"name":"billing_analytics_2","question":"Show receivables by ageing bucket","sql":"SELECT AGEING_BUCKET, SUM(OUTSTANDING_BSD) AS OUTSTANDING_BSD FROM CABLEBAHAMAS_DEMO.ANALYTICS_V2.RECEIVABLES GROUP BY AGEING_BUCKET ORDER BY MIN(DAYS_OVERDUE)","use_as_onboarding_question":false}]}