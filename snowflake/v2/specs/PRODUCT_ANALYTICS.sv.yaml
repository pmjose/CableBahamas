{"name":"PRODUCT_ANALYTICS","description":"REV fixed product catalogue (REVHome tiers, REVHome + TV, REVConnect convergent bundle, voice, business): monthly price, direct monthly cost and speed. Direct margin excludes overhead.","module_custom_instructions":{"sql_generation":"All data is synthetic demo data for Cable Bahamas (REV fixed and aliv mobile), generated from the web demo baseline. Reference date 2026-10-31: \"latest\", \"current\", \"this month\" or \"today\" mean October 2026; \"this quarter\" means August–October 2026 unless the user names a calendar quarter; \"year to date\" means January–October 2026. Never use CURRENT_DATE. Currency is BSD (pegged 1:1 to USD). Percentages are 0-100. Use ratio of sums for weighted rates. Do not sum snapshot counts across dates. Do not join unrelated fact tables. Islands: New Providence (Nassau), Grand Bahama (Freeport), Abaco, Eleuthera, Exuma, Andros, Other Family Islands (Bimini and others)."},"tables":[{"name":"PRODUCTS","description":"One row per fixed product.","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS_V2","table":"PRODUCTS"},"dimensions":[{"name":"product_id","expr":"PRODUCT_ID","data_type":"VARCHAR","description":"product id"},{"name":"product_name","expr":"PRODUCT_NAME","data_type":"VARCHAR","description":"product name"},{"name":"service_family","expr":"SERVICE_FAMILY","data_type":"VARCHAR","description":"service family"},{"name":"customer_segment","expr":"CUSTOMER_SEGMENT","data_type":"VARCHAR","description":"customer segment"}],"time_dimensions":[],"facts":[{"name":"monthly_price_bsd","expr":"MONTHLY_PRICE_BSD","data_type":"NUMBER","description":"monthly price bsd"},{"name":"monthly_cost_bsd","expr":"MONTHLY_COST_BSD","data_type":"NUMBER","description":"monthly cost bsd"},{"name":"download_mbps","expr":"DOWNLOAD_MBPS","data_type":"NUMBER","description":"download mbps"}],"metrics":[{"name":"products","expr":"COUNT(DISTINCT PRODUCT_ID)","description":"products"},{"name":"avg_price_bsd","expr":"AVG(MONTHLY_PRICE_BSD)","description":"avg price bsd"},{"name":"avg_direct_margin_bsd","expr":"AVG(MONTHLY_PRICE_BSD - MONTHLY_COST_BSD)","description":"avg direct margin bsd"}]}],"verified_queries":[{"name":"product_analytics_1","question":"Which products have the largest direct margin?","sql":"SELECT PRODUCT_NAME, MONTHLY_PRICE_BSD, MONTHLY_PRICE_BSD - MONTHLY_COST_BSD AS DIRECT_MARGIN_BSD FROM CABLEBAHAMAS_DEMO.ANALYTICS_V2.PRODUCTS ORDER BY DIRECT_MARGIN_BSD DESC","use_as_onboarding_question":true}]}