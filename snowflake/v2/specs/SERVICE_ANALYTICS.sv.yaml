{"name":"SERVICE_ANALYTICS","description":"Customer care contacts in October 2026 (21,400): theme, channel, island, first-contact resolution, handle time, CSAT. Includes cancellation intent (\"Cancel / switching to BTC\").","module_custom_instructions":{"sql_generation":"All data is synthetic demo data for Cable Bahamas (REV fixed and aliv mobile), generated from the web demo baseline. Reference date 2026-10-31: \"latest\", \"current\", \"this month\" or \"today\" mean October 2026; \"this quarter\" means August–October 2026 unless the user names a calendar quarter; \"year to date\" means January–October 2026. Never use CURRENT_DATE. Currency is BSD (pegged 1:1 to USD). Percentages are 0-100. Use ratio of sums for weighted rates. Do not sum snapshot counts across dates. Do not join unrelated fact tables. Islands: New Providence (Nassau), Grand Bahama (Freeport), Abaco, Eleuthera, Exuma, Andros, Other Family Islands (Bimini and others)."},"tables":[{"name":"SUPPORT_CASES","description":"One row per customer contact opened in October 2026.","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS_V2","table":"SUPPORT_CASES"},"dimensions":[{"name":"case_id","expr":"CASE_ID","data_type":"VARCHAR","description":"case id"},{"name":"island","expr":"ISLAND","data_type":"VARCHAR","description":"island"},{"name":"theme","expr":"THEME","data_type":"VARCHAR","description":"theme"},{"name":"channel","expr":"CHANNEL","data_type":"VARCHAR","description":"channel"},{"name":"digital","expr":"DIGITAL","data_type":"BOOLEAN","description":"digital"},{"name":"first_contact_resolved","expr":"FIRST_CONTACT_RESOLVED","data_type":"BOOLEAN","description":"first contact resolved"},{"name":"status","expr":"STATUS","data_type":"VARCHAR","description":"status"}],"time_dimensions":[{"name":"opened_date","expr":"OPENED_DATE","data_type":"DATE","description":"opened date"}],"facts":[{"name":"handle_time_min","expr":"HANDLE_TIME_MIN","data_type":"NUMBER","description":"handle time min"},{"name":"csat_score","expr":"CSAT_SCORE","data_type":"NUMBER","description":"csat score"}],"metrics":[{"name":"contacts","expr":"COUNT(DISTINCT CASE_ID)","description":"contacts"},{"name":"first_contact_resolution_pct","expr":"100.0 * COUNT_IF(FIRST_CONTACT_RESOLVED) / NULLIF(COUNT(*), 0)","description":"first contact resolution pct"},{"name":"digital_share_pct","expr":"100.0 * COUNT_IF(DIGITAL) / NULLIF(COUNT(*), 0)","description":"digital share pct"},{"name":"avg_handle_time_min","expr":"AVG(HANDLE_TIME_MIN)","description":"avg handle time min"},{"name":"avg_csat","expr":"AVG(CSAT_SCORE)","description":"avg csat"}]}],"verified_queries":[{"name":"service_analytics_1","question":"What are the top reasons customers contacted us this month?","sql":"SELECT THEME, COUNT(*) AS CONTACTS FROM CABLEBAHAMAS_DEMO.ANALYTICS_V2.SUPPORT_CASES GROUP BY THEME ORDER BY CONTACTS DESC","use_as_onboarding_question":true}]}