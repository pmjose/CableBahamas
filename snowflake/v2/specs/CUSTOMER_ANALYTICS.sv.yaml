{"name":"CUSTOMER_ANALYTICS","description":"Fixed (REV) customers at 2026-10-31: one row per fixed account (74,400) with island, product, MRR, churn risk, 36-month CLV, NPS, consent and whether the household also has aliv mobile (convergent). CUSTOMER_MOVEMENTS has monthly gross adds, disconnects, win-backs and net adds by island (Nov 2025–Oct 2026).","module_custom_instructions":{"sql_generation":"All data is synthetic demo data for Cable Bahamas (REV fixed and aliv mobile), generated from the web demo baseline. Reference date 2026-10-31: \"latest\", \"current\", \"this month\" or \"today\" mean October 2026; \"this quarter\" means August–October 2026 unless the user names a calendar quarter; \"year to date\" means January–October 2026. Never use CURRENT_DATE. Currency is BSD (pegged 1:1 to USD). Percentages are 0-100. Use ratio of sums for weighted rates. Do not sum snapshot counts across dates. Do not join unrelated fact tables. Islands: New Providence (Nassau), Grand Bahama (Freeport), Abaco, Eleuthera, Exuma, Andros, Other Family Islands (Bimini and others)."},"tables":[{"name":"CUSTOMERS","description":"One row per fixed customer account, snapshot 2026-10-31.","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS_V2","table":"CUSTOMERS"},"primary_key":{"columns":["CUSTOMER_ID"]},"dimensions":[{"name":"customer_id","expr":"CUSTOMER_ID","data_type":"VARCHAR","description":"customer id"},{"name":"customer_name","expr":"CUSTOMER_NAME","data_type":"VARCHAR","description":"customer name"},{"name":"product_id","expr":"PRODUCT_ID","data_type":"VARCHAR","description":"product id"},{"name":"product_name","expr":"PRODUCT_NAME","data_type":"VARCHAR","description":"product name"},{"name":"service_family","expr":"SERVICE_FAMILY","data_type":"VARCHAR","description":"service family"},{"name":"customer_segment","expr":"CUSTOMER_SEGMENT","data_type":"VARCHAR","description":"customer segment"},{"name":"island","expr":"ISLAND","data_type":"VARCHAR","description":"island"},{"name":"town","expr":"TOWN","data_type":"VARCHAR","description":"town"},{"name":"churn_risk","expr":"CHURN_RISK","data_type":"VARCHAR","description":"churn risk"},{"name":"tier","expr":"TIER","data_type":"VARCHAR","description":"tier"},{"name":"marketing_consent","expr":"MARKETING_CONSENT","data_type":"BOOLEAN","description":"marketing consent"},{"name":"has_aliv_mobile","expr":"HAS_ALIV_MOBILE","data_type":"BOOLEAN","description":"has aliv mobile"}],"time_dimensions":[{"name":"join_date","expr":"JOIN_DATE","data_type":"DATE","description":"join date"},{"name":"snapshot_date","expr":"SNAPSHOT_DATE","data_type":"DATE","description":"snapshot date"}],"facts":[{"name":"tenure_months","expr":"TENURE_MONTHS","data_type":"NUMBER","description":"tenure months"},{"name":"current_mrr_bsd","expr":"CURRENT_MRR_BSD","data_type":"NUMBER","description":"current mrr bsd"},{"name":"churn_score","expr":"CHURN_SCORE","data_type":"NUMBER","description":"churn score"},{"name":"nps_score","expr":"NPS_SCORE","data_type":"NUMBER","description":"nps score"},{"name":"expected_36m_clv_bsd","expr":"EXPECTED_36M_CLV_BSD","data_type":"NUMBER","description":"expected 36m clv bsd"}],"metrics":[{"name":"fixed_customers","expr":"COUNT(DISTINCT CUSTOMER_ID)","description":"fixed customers"},{"name":"fixed_mrr_bsd","expr":"SUM(CURRENT_MRR_BSD)","description":"fixed mrr bsd"},{"name":"fixed_arpu_bsd","expr":"AVG(CURRENT_MRR_BSD)","description":"fixed arpu bsd"},{"name":"high_risk_customers","expr":"COUNT_IF(CHURN_RISK = 'High')","description":"high risk customers"},{"name":"clv_36m_bsd","expr":"SUM(EXPECTED_36M_CLV_BSD)","description":"clv 36m bsd"},{"name":"convergent_households","expr":"COUNT_IF(HAS_ALIV_MOBILE)","description":"convergent households"},{"name":"nps","expr":"100.0 * (COUNT_IF(NPS_SCORE >= 9) - COUNT_IF(NPS_SCORE <= 6)) / NULLIF(COUNT(NPS_SCORE), 0)","description":"nps"}]},{"name":"CUSTOMER_MOVEMENTS","description":"Monthly fixed subscriber movement by island. Churn rate = disconnects / opening_subs.","base_table":{"database":"CABLEBAHAMAS_DEMO","schema":"ANALYTICS_V2","table":"CUSTOMER_MOVEMENTS"},"dimensions":[{"name":"island","expr":"ISLAND","data_type":"VARCHAR","description":"island"}],"time_dimensions":[{"name":"month_start","expr":"MONTH_START","data_type":"DATE","description":"month start"}],"facts":[{"name":"opening_subs","expr":"OPENING_SUBS","data_type":"NUMBER","description":"opening subs"},{"name":"gross_adds","expr":"GROSS_ADDS","data_type":"NUMBER","description":"gross adds"},{"name":"disconnects","expr":"DISCONNECTS","data_type":"NUMBER","description":"disconnects"},{"name":"win_backs","expr":"WIN_BACKS","data_type":"NUMBER","description":"win backs"},{"name":"net_adds","expr":"NET_ADDS","data_type":"NUMBER","description":"net adds"},{"name":"closing_subs","expr":"CLOSING_SUBS","data_type":"NUMBER","description":"closing subs"}],"metrics":[{"name":"total_gross_adds","expr":"SUM(GROSS_ADDS)","description":"gross adds"},{"name":"total_disconnects","expr":"SUM(DISCONNECTS)","description":"disconnects"},{"name":"total_net_adds","expr":"SUM(NET_ADDS)","description":"net adds"},{"name":"total_win_backs","expr":"SUM(WIN_BACKS)","description":"win backs"},{"name":"churn_rate_pct","expr":"100.0 * SUM(DISCONNECTS) / NULLIF(SUM(OPENING_SUBS), 0)","description":"churn rate pct"}]}],"verified_queries":[{"name":"customer_analytics_1","question":"How many fixed customers do we have by island?","sql":"SELECT ISLAND, COUNT(*) AS FIXED_CUSTOMERS FROM CABLEBAHAMAS_DEMO.ANALYTICS_V2.CUSTOMERS GROUP BY ISLAND ORDER BY FIXED_CUSTOMERS DESC","use_as_onboarding_question":true},{"name":"customer_analytics_2","question":"Which island has the highest churn this month?","sql":"SELECT ISLAND, 100.0*SUM(DISCONNECTS)/SUM(OPENING_SUBS) AS CHURN_RATE_PCT, SUM(DISCONNECTS) AS DISCONNECTS FROM CABLEBAHAMAS_DEMO.ANALYTICS_V2.CUSTOMER_MOVEMENTS WHERE MONTH_START='2026-10-01' GROUP BY ISLAND ORDER BY CHURN_RATE_PCT DESC","use_as_onboarding_question":false},{"name":"customer_analytics_3","question":"Which high-value customers are at high churn risk?","sql":"SELECT CUSTOMER_ID, CUSTOMER_NAME, ISLAND, TOWN, TIER, CURRENT_MRR_BSD, EXPECTED_36M_CLV_BSD FROM CABLEBAHAMAS_DEMO.ANALYTICS_V2.CUSTOMERS WHERE CHURN_RISK='High' ORDER BY EXPECTED_36M_CLV_BSD DESC LIMIT 20","use_as_onboarding_question":false}]}